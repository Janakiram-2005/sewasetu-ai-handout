; Sewa Setu configuration
; Consolidated from config/settings.ini, March 2026 (CR-2026-031)

; Local development fallback only. In production (Render), set DATABASE_URL,
; SECRET_KEY, ADMIN_PASSWORD, and PUBLIC_BASE_URL via environment variables.
[database]
host = db
port = 5432
name = sewasetu
user = sewasetu
password =

[app]
secret_key = dev-local-only-override-with-env
sms_gateway_url = http://smsgw:8025
otp_validity_seconds = 300
upload_dir = /var/sewasetu/uploads

[pension]
min_age = 60
sla_days = 15
scheme_deadline = 2026-10-31 23:59
